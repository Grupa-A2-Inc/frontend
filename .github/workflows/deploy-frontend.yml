name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, elearnserver, frontend]

    env:
      KUBECONFIG: /home/lyo/.kube/config
      DOCKER_CONFIG_DIR: /tmp/docker-config-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docker auth manually
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          rm -rf "$DOCKER_CONFIG_DIR"
          mkdir -p "$DOCKER_CONFIG_DIR"

          AUTH="$(printf "%s:%s" "$DOCKER_USERNAME" "$DOCKER_PASSWORD" | base64 -w 0)"

          cat > "$DOCKER_CONFIG_DIR/config.json" <<EOF
          {
            "auths": {
              "https://index.docker.io/v1/": {
                "auth": "$AUTH"
              }
            }
          }
          EOF

      - name: Debug Docker config
        run: |
          echo "DOCKER_CONFIG_DIR=$DOCKER_CONFIG_DIR"
          ls -la "$DOCKER_CONFIG_DIR"
          cat "$DOCKER_CONFIG_DIR/config.json"

      - name: Build Docker image
        run: |
          docker --config "$DOCKER_CONFIG_DIR" build \
            -t lyochris/elearning-frontend:latest \
            -t lyochris/elearning-frontend:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker --config "$DOCKER_CONFIG_DIR" push lyochris/elearning-frontend:latest
          docker --config "$DOCKER_CONFIG_DIR" push lyochris/elearning-frontend:${{ github.sha }}

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s-frontend/01-frontend.yaml

      - name: Deploy image to Kubernetes
        run: |
          kubectl set image deployment/elearning-frontend \
            elearning-frontend=lyochris/elearning-frontend:${{ github.sha }} \
            -n elearning

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/elearning-frontend -n elearning --timeout=180s

      - name: Rollback if deployment failed
        if: failure()
        run: |
          kubectl rollout undo deployment/elearning-frontend -n elearning || true
          kubectl rollout status deployment/elearning-frontend -n elearning --timeout=180s || true

      - name: Clean Docker config
        if: always()
        run: |
          rm -rf "$DOCKER_CONFIG_DIR"
