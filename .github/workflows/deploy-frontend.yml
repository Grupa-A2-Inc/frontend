name: Deploy Frontend

on:
  push:
    branches:
      - main

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, elearnserver, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t lyochris/elearning-frontend:latest \
            -t lyochris/elearning-frontend:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push lyochris/elearning-frontend:latest
          docker push lyochris/elearning-frontend:${{ github.sha }}

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s-frontend/01-frontend.yaml

      - name: Deploy image to Kubernetes
        run: |
          kubectl set image deployment/elearning-frontend \
            elearning-frontend=lyochris/elearning-frontend:${{ github.sha }} \
            -n elearning

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/elearning-frontend -n elearning
